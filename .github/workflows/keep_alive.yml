name: Keep Alive

# GitHub Actions의 schedule 워크플로우는 60일간 저장소 활동이 없으면 자동 비활성화됨.
# 이 워크플로우는 주기적으로 더미 커밋을 생성하여 비활성화를 방지함.

on:
  schedule:
    - cron: "0 2 1,15 * *" # 매월 1일, 15일 UTC 02:00 (한국시간 11:00)
  workflow_dispatch: # 수동 실행

permissions:
  contents: write # keep_alive.txt 커밋·푸시에 필요

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update keep_alive.txt
        run: |
          echo "Last keep-alive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > keep_alive.txt

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keep_alive.txt
          # 변경 사항이 없으면 커밋하지 않고 조용히 종료
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Keep alive: automatic commit to prevent workflow suspension"
          git push origin HEAD:${{ github.ref_name }}
